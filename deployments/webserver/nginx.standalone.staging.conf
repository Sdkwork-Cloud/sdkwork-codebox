# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/codebox/webserver.pid;
error_log /var/log/sdkwork/codebox/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name codebox-staging.sdkwork.com codebox-staging.birdcoder.com codebox-staging.dtupay.com codebox-staging.sdkwork.cn codebox-staging.birdcoder.cn codebox-staging.dtupay.cn codebox-staging.skubc.com codebox-staging.skubc.cn codebox-staging.zowalk.com codebox-staging.zowalk.cn codebox-staging.offer86.com codebox-staging.offer86.cn codebox-staging.86offer.com codebox-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
