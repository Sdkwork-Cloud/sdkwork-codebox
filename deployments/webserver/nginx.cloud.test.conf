# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/codebox/webserver.pid;
error_log /var/log/sdkwork/codebox/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name codebox-test.sdkwork.com codebox-test.birdcoder.com codebox-test.dtupay.com codebox-test.noaper.com codebox-test.sdkwork.cn codebox-test.birdcoder.cn codebox-test.dtupay.cn codebox-test.noaper.cn codebox-test.skubc.com codebox-test.skubc.cn codebox-test.zowalk.com codebox-test.zowalk.cn codebox-test.offer86.com codebox-test.offer86.cn codebox-test.86offer.com codebox-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
