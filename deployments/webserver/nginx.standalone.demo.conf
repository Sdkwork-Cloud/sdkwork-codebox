# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/codebox/webserver.pid;
error_log /var/log/sdkwork/codebox/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name codebox-demo.sdkwork.com codebox-demo.birdcoder.com codebox-demo.dtupay.com codebox-demo.noaper.com codebox-demo.sdkwork.cn codebox-demo.birdcoder.cn codebox-demo.dtupay.cn codebox-demo.noaper.cn codebox-demo.skubc.com codebox-demo.skubc.cn codebox-demo.zowalk.com codebox-demo.zowalk.cn codebox-demo.offer86.com codebox-demo.offer86.cn codebox-demo.86offer.com codebox-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/codebox/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
